services:

  db:
    container_name: tfc-postgres
    image: postgres:18-alpine
    shm_size: 128mb
    expose:
      - 5432
    networks:
      - tfc
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - .env

  users:
    container_name: micro-users
    build: 
      context: .
      dockerfile: micro-users/Dockerfile
    expose:
      - 8000
    networks:
      - tfc
    volumes:
      - ./micro-users:/app/micro-users
    depends_on:
      - db
  bikes:
    container_name: micro-bikes
    build: 
      context: .
      dockerfile: micro-bikes/Dockerfile
    expose:
      - 8000
    networks:
      - tfc
    env_file:
      - .env
    volumes:
      - ./micro-bikes:/app/micro-bikes 
  forums:
    container_name: micro-forum
    build: 
      context: .
      dockerfile: micro-forum/Dockerfile
    expose:
      - 8000
    networks:
      - tfc
    env_file:
      - .env
    volumes:
      - ./micro-forum:/app/micro-forum   
  
  #micro-images:
  #  container_name: micro-images
  #  build: 
  #    context: ./micro-images
  #  expose:
  #    - 3000
  #  networks:
  #    - tfc
  #  env_file:
  #    - .env


  gateway:
    image: nginx:alpine
    container_name: tfc-gateway
    ports:
      - 8200:80 
    networks:
      - tfc
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - users
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data: {}
  minio_data: {}
  
  
networks:
  tfc:
    driver: bridge
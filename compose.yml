services:

  db:
    container_name: tfc-postgres
    image: postgres:18-alpine
    shm_size: 128mb
    expose:
      - 5432
    networks:
      - tfc
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - .env

    


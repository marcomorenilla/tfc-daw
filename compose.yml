services:

  db:
    container_name: tfc-postgres
    image: postgres:18-alpine
    shm_size: 128mb
    expose:
      - 5432
    networks:
      - tfc
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - .env

    

  users:
    container_name: micro-users
    build: 
      context: .
      dockerfile: micro-users/Dockerfile
    expose:
      - 8000
    networks:
      - tfc
    volumes:
      - ./utils:/app/utils
      - ./micro-users:/app/micro-users

  gateway:
    image: nginx:alpine
    container_name: tfc-gateway
    ports:
      - "80:80" 
    networks:
      - tfc
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - users

volumes:
  postgres-data: {}


networks:
  tfc:
    external: true
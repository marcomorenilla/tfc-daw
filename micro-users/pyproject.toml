[project]
name = "micro-users"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
readme_encoding = "UTF-8"
requires-python = ">=3.12"
dependencies = [
    "shared-utils"
]

[tool.uv.sources]
shared-utils = {path="../shared-utils", editable=true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micro_users"]

[project.scripts]
start-api = "micro_users.main:main"
